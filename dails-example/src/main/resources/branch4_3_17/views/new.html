<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/base}">
<head>
	<title>系统首页</title>
</head>
<body>


<!-- 主内容区域 -->
<div layout:fragment="content">
	<div class="col-sm-9 col-sm-offset-3 col-md-10 col-md-offset-2">
		<h3 class="blog-title">{objname} 添加</h3>
		<div th:fragment="{objname}Form">
			<form id="{objname}Form"  class="form-horizontal"  th:action="@{/{objname}/save}" th:method="post"
				  th:object="${obj}">
				<input type="hidden" class="form-control" name="id" id="id" th:value="${id}" />
				newForm
				<div class="form-group">
					<div class="col-sm-offset-10 col-sm-2">
						<input type="submit" class="btn btn-success" value="保存"/>
					</div>
				</div>
			</form>
		</div>
	</div>
</div>


</body>
<section layout:fragment="scripts">
	<script th:src="@{/assets/bootstrap5/js/bootstrap.bundle.min.js}"></script>
	<script th:src="@{/assets/bootstrap5/js/jquery-3.5.1.min.js}"></script>
	<script type="text/javascript" src="/assets/js/{objname}.js"></script>
	<script th:inline="javascript">

	</script>
</section>
</html>
