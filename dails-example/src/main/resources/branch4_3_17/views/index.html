<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/base}">
<head>
	<title>系统首页</title>
</head>
<body>


<!-- 主内容区域 -->
<div layout:fragment="content">
	<div class="col-sm-9 col-sm-offset-3 col-md-10 col-md-offset-2">
		<h3>{objname} 列表</h3>
		<div class="col-sm-12 col-lg-12" id="list">
			<table class="table table-striped">
				<thead>
				<tr>
					${tr1}
				</tr>
				</thead>
				<tbody id="tbodylist">
				</tbody>
			</table>
			<div class="page">
				<ul class="pagination"></ul>
			</div>
		</div>
		<nav>
			<ul class="pager">
				<li>
					<a th:href="@{/{objname}/addView}">新增</a>
				</li>
			</ul>
		</nav>
	</div>


</div>


</body>
<section layout:fragment="scripts">
	<<script th:src="@{/assets/bootstrap5/js/bootstrap.bundle.min.js}"></script>
	<script th:src="@{/assets/bootstrap5/js/jquery-3.5.1.min.js}"></script>
	<script th:src="@{/assets/bootstrap5/js/bootstrap-paginator.js}"></script>
	<script type="text/javascript" src="/assets/js/util.js"></script>
	<script type="text/javascript" src="/assets/js/{objname}.js"></script>
	<script th:inline="javascript">
		$(document).ready(function() {

		})
		var currentPage = 1;
		var pageSize = 5;

		findPage();
	</script>
</section>
</html>
