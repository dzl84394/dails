<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:include="layout::head">

</head>

<body role="document">

	<nav class="navbar navbar-inverse navbar-fixed-top" role="navigation" th:include="layout::header"></nav>


	<div class="container-fluid">
		<div class="row">
			<div class="col-sm-3 col-md-2 col-md-2 sidebar"
				 th:include="layout::project_sidebar"></div>

			<div class="col-sm-9 col-sm-offset-3 col-md-10 col-md-offset-2">
				<h3 class="blog-title">subApiScope 添加</h3>
				<div th:fragment="subApiScopeForm">

					<form id="subApiScopeForm"  class="form-horizontal"  th:action="@{/subApiScope/save}" th:method="post"
						  th:object="${obj}">
						<input type="hidden" class="form-control" name="id" id="id" th:value="${id}" />
							               <div class='form-group col-lg-12'> 
						<label for='projectSn' class='col-sm-2 control-label'>projectSn</label>
						<div class='col-sm-10'>
							<input type='text' class='form-control' name='projectSn' id='projectSn' th:value='${obj.projectSn}'/>
						</div>
					</div>
               <div class='form-group col-lg-12'> 
						<label for='serviceSn' class='col-sm-2 control-label'>serviceSn</label>
						<div class='col-sm-10'>
							<input type='text' class='form-control' name='serviceSn' id='serviceSn' th:value='${obj.serviceSn}'/>
						</div>
					</div>
               <div class='form-group col-lg-12'> 
						<label for='scope' class='col-sm-2 control-label'>scope</label>
						<div class='col-sm-10'>
							<input type='text' class='form-control' name='scope' id='scope' th:value='${obj.scope}'/>
						</div>
					</div>
               <div class='form-group col-lg-12'> 
						<label for='parentId' class='col-sm-2 control-label'>parentId</label>
						<div class='col-sm-10'>
							<input type='text' class='form-control' name='parentId' id='parentId' th:value='${obj.parentId}'/>
						</div>
					</div>

						<div class="form-group">
							<div class="col-sm-offset-10 col-sm-2">

								<input type="submit" class="btn btn-success" value="保存"/>
							</div>
						</div>
					</form>
				</div>
			</div>
			<!-- /.blog-main -->
		</div>
		<!-- /.row -->
	</div>
	<!-- /.container -->

</body>
<script type="text/javascript" src="/static/pms/js/subApiScope.js"></script>
<script th:inline="javascript">

</script>


</html>
