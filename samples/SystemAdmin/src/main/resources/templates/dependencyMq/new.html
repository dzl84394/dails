<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:include="layout::head">

</head>

<body role="document">

	<nav class="navbar navbar-inverse navbar-fixed-top" role="navigation" th:include="layout::header"></nav>


	<div class="container-fluid">
		<div class="row">
			<div class="col-sm-3 col-md-2 col-md-2 sidebar"
				 th:include="layout::serviceAdmin_sidebar"></div>

			<div class="col-sm-9 col-sm-offset-3 col-md-10 col-md-offset-2">
				<h3 class="blog-title">dependencyMq 添加</h3>
				<div th:fragment="dependencyMqForm">

					<form id="dependencyMqForm"  class="form-horizontal"  th:action="@{/dependencyMq/save}" th:method="post"
						  th:object="${obj}">
						<input type="hidden" class="form-control" name="id" id="id" th:value="${id}" />
							               <div class='form-group col-lg-12'> 
						<label for='mqSn' class='col-sm-2 control-label'>mqSn</label>
						<div class='col-sm-10'>
							<input type='text' class='form-control' name='mqSn' id='mqSn' th:value='${obj.mqSn}'/>
						</div>
					</div>
               <div class='form-group col-lg-12'> 
						<label for='mqType' class='col-sm-2 control-label'>mqType</label>
						<div class='col-sm-10'>
							<input type='text' class='form-control' name='mqType' id='mqType' th:value='${obj.mqType}'/>
						</div>
					</div>
               <div class='form-group col-lg-12'> 
						<label for='exchangeName' class='col-sm-2 control-label'>exchangeName</label>
						<div class='col-sm-10'>
							<input type='text' class='form-control' name='exchangeName' id='exchangeName' th:value='${obj.exchangeName}'/>
						</div>
					</div>
               <div class='form-group col-lg-12'> 
						<label for='exchangeType' class='col-sm-2 control-label'>exchangeType</label>
						<div class='col-sm-10'>
							<input type='text' class='form-control' name='exchangeType' id='exchangeType' th:value='${obj.exchangeType}'/>
						</div>
					</div>
               <div class='form-group col-lg-12'> 
						<label for='quene' class='col-sm-2 control-label'>quene</label>
						<div class='col-sm-10'>
							<input type='text' class='form-control' name='quene' id='quene' th:value='${obj.quene}'/>
						</div>
					</div>
               <div class='form-group col-lg-12'> 
						<label for='routingkey' class='col-sm-2 control-label'>routingkey</label>
						<div class='col-sm-10'>
							<input type='text' class='form-control' name='routingkey' id='routingkey' th:value='${obj.routingkey}'/>
						</div>
					</div>
               <div class='form-group col-lg-12'> 
						<label for='topic' class='col-sm-2 control-label'>topic</label>
						<div class='col-sm-10'>
							<input type='text' class='form-control' name='topic' id='topic' th:value='${obj.topic}'/>
						</div>
					</div>
               <div class='form-group col-lg-12'> 
						<label for='clientId' class='col-sm-2 control-label'>clientId</label>
						<div class='col-sm-10'>
							<input type='text' class='form-control' name='clientId' id='clientId' th:value='${obj.clientId}'/>
						</div>
					</div>
               <div class='form-group col-lg-12'> 
						<label for='groupId' class='col-sm-2 control-label'>groupId</label>
						<div class='col-sm-10'>
							<input type='text' class='form-control' name='groupId' id='groupId' th:value='${obj.groupId}'/>
						</div>
					</div>
               <div class='form-group col-lg-12'> 
						<label for='role' class='col-sm-2 control-label'>role</label>
						<div class='col-sm-10'>
							<select class="form-control" name='role' id='role' th:value='${obj.role}'>
								<option value="Producer" th:selected="${obj.role == 'Producer'}">Producer</option>
								<option value="Producer" th:selected="${obj.role == 'Consumer'}">Consumer</option>
								<option value="All" th:selected="${obj.role == 'All'}">All</option>
							</select>
						</div>
					</div>
               <div class='form-group col-lg-12'> 
						<label for='projectSn' class='col-sm-2 control-label'>projectSn</label>
						<div class='col-sm-10'>
							<input type='text' class='form-control' name='projectSn' id='projectSn' th:value='${obj.projectSn}'/>
						</div>
					</div>
               <div class='form-group col-lg-12'> 
						<label for='serviceSn' class='col-sm-2 control-label'>serviceSn</label>
						<div class='col-sm-10'>
							<input type='text' class='form-control' name='serviceSn' id='serviceSn' th:value='${obj.serviceSn}'/>
						</div>
					</div>
               <div class='form-group col-lg-12'> 
						<label for='status' class='col-sm-2 control-label'>status</label>
						<div class='col-sm-10'>
							<input type='text' class='form-control' name='status' id='status' th:value='${obj.status}'/>
						</div>
					</div>
               <div class='form-group col-lg-12'> 
						<label for='env' class='col-sm-2 control-label'>env</label>
						<div class='col-sm-10'>
							<input type='text' class='form-control' name='env' id='env' th:value='${obj.env}'/>
						</div>
					</div>

						<div class="form-group">
							<div class="col-sm-offset-10 col-sm-2">

								<input type="submit" class="btn btn-success" value="保存"/>
							</div>
						</div>
					</form>
				</div>
			</div>
			<!-- /.blog-main -->
		</div>
		<!-- /.row -->
	</div>
	<!-- /.container -->

</body>
<script type="text/javascript" src="/static/pms/js/dependencyMq.js"></script>
<script th:inline="javascript">

</script>


</html>
