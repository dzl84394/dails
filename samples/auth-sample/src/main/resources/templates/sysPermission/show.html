<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/base}">
<head>
	<title>系统首页</title>
</head>
<body>


<!-- 主内容区域 -->
<div layout:fragment="content">
	<div class="col-sm-9 col-sm-offset-3 col-md-10 col-md-offset-2 form-horizontal">
		<h2 class="blog-post-title">sysPermission show</h2>
		<input type="hidden" class="form-control" name="id" id="id" th:value="${id}" />
		<hr />
        <dl class="row">
            <dt class="col-sm-3">parentId</dt>
            <dd class="col-sm-9" th:text='${obj.parentId}' ></dd>
            <dt class="col-sm-3">mtype</dt>
            <dd class="col-sm-9" th:text='${obj.mtype}' ></dd>
    、
            <dt class="col-sm-3">httpMethod</dt>
            <dd class="col-sm-9" th:text='${obj.httpMethod}' ></dd>

            <dt class="col-sm-3">permissionName</dt>
            <dd class="col-sm-9" th:text='${obj.permissionName}' ></dd>
            <dt class="col-sm-3">permissionCode</dt>
            <dd class="col-sm-9" th:text='${obj.permissionCode}' ></dd>
            <dt class="col-sm-3">resource</dt>
            <dd class="col-sm-9" th:text='${obj.resource}' ></dd>
</dl>

		<div class="form-group">
			<div class="col-sm-offset-8 col-sm-4">
				<a type="button" class="btn btn-success" th:href="@{'/sysPermission/indexView'}">返回列表</a>
				<a type="button" class="btn btn-info" th:href="@{'/sysPermission/editView?id='+${id}}">编辑</a>
			</div>
		</div>
	</div>
</div>


</body>
<section layout:fragment="scripts">
	<script th:src="@{/assets/bootstrap5/js/bootstrap.bundle.min.js}"></script>
	<script th:src="@{/assets/bootstrap5/js/jquery-3.5.1.min.js}"></script>
	<script type="text/javascript" src="/assets/js/util.js"></script>
	<script type="text/javascript" src="/assets/js/sysPermission.js"></script>
	<script th:inline="javascript">
		refreshBreadcrumb([
			{name: 'Home', url: '/home'},
			{name: '修改', url: '/sysPermission'},
			{name: '详情页'}
		]);
		toggleCollapseById('sys-collapse');
	</script>
</section>
</html>
