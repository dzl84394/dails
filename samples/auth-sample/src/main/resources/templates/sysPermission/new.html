<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/base}">
<head>
	<title>系统首页</title>
</head>
<body>


<!-- 主内容区域 -->
<div layout:fragment="content">
	<div class="col-sm-9 col-sm-offset-3 col-md-10 col-md-offset-2">
		<h3 class="blog-title">sysPermission 添加</h3>
		<div th:fragment="sysPermissionForm">
			<form id="sysPermissionForm"  class="form-horizontal"  th:action="@{/sysPermission/save}" th:method="post"
				  th:object="${obj}">


               <div class='form-group col-lg-12'> 
						<label for='parentId' class='col-sm-2 control-label'>parentId</label>
						<div class='col-sm-10'>
							<input type='text' class='form-control' name='parentId' id='parentId' th:value='${obj.parentId}'/>
						</div>
					</div>
               <div class='form-group col-lg-12'> 
						<label for='mtype' class='col-sm-2 control-label'>mtype</label>
						<div class='col-sm-10'>
							<input type='text' class='form-control' name='mtype' id='mtype' th:value='${obj.mtype}'/>
						</div>
					</div>
               <div class='form-group col-lg-12'> 
						<label for='httpMethod' class='col-sm-2 control-label'>httpMethod</label>
						<div class='col-sm-10'>
							<input type='text' class='form-control' name='httpMethod' id='httpMethod' th:value='${obj.httpMethod}'/>
						</div>
					</div>
               <div class='form-group col-lg-12'> 
						<label for='sort' class='col-sm-2 control-label'>sort</label>
						<div class='col-sm-10'>
							<input type='text' class='form-control' name='sort' id='sort' th:value='${obj.sort}'/>
						</div>
					</div>
               <div class='form-group col-lg-12'> 
						<label for='status' class='col-sm-2 control-label'>status</label>
						<div class='col-sm-10'>
							<input type='text' class='form-control' name='status' id='status' th:value='${obj.status}'/>
						</div>
					</div>
               <div class='form-group col-lg-12'> 
						<label for='path' class='col-sm-2 control-label'>path</label>
						<div class='col-sm-10'>
							<input type='text' class='form-control' name='path' id='path' th:value='${obj.path}'/>
						</div>
					</div>
               <div class='form-group col-lg-12'> 
						<label for='remarks' class='col-sm-2 control-label'>remarks</label>
						<div class='col-sm-10'>
							<input type='text' class='form-control' name='remarks' id='remarks' th:value='${obj.remarks}'/>
						</div>
					</div>

				<div class="form-group">
					<div class="col-sm-offset-10 col-sm-2">
						<input type="submit" class="btn btn-success" value="保存"/>
					</div>
				</div>
			</form>
		</div>
	</div>
</div>


</body>
<section layout:fragment="scripts">
	<script th:src="@{/assets/bootstrap5/js/bootstrap.bundle.min.js}"></script>
	<script th:src="@{/assets/bootstrap5/js/jquery-3.5.1.min.js}"></script>
	<script type="text/javascript" src="/assets/js/sysPermission.js"></script>
	<script th:inline="javascript">
		refreshBreadcrumb([
                {name: 'Home', url: '/home'},
                {name: '用户', url: '/sysUser'},
                {name: '详情'}
            ]);
            toggleCollapseById('sys-collapse');
	</script>
</section>
</html>
