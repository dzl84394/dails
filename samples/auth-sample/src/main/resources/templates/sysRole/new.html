<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/base}">
<head>
	<title>系统首页</title>
</head>
<body>


<!-- 主内容区域 -->
<div layout:fragment="content">
	<div class="col-sm-9 col-sm-offset-3 col-md-10 col-md-offset-2">
		<h3 class="blog-title">sysRole 添加</h3>
		<div th:fragment="sysRoleForm">
			<form id="sysRoleForm"  class="form-horizontal"  th:action="@{/sysRole/save}" th:method="post"
				  th:object="${obj}">
				<input type="hidden" class="form-control" name="id" id="id" th:value="${id}" />
				
				<div class="mb-3 row">
					<label for="roleCode" class="col-sm-2 col-form-label">roleCode</label>
					<div class="col-sm-4">
						<input type="text" class="form-control" id="roleCode" name='roleCode' th:value='${obj.roleCode}'>
					</div>
				</div>
				<div class="mb-3 row">
					<label for="roleName" class="col-sm-2 col-form-label">roleName</label>
					<div class="col-sm-4">
						<input type="text" class="form-control" id="roleName" name='roleName' th:value='${obj.roleName}'>
					</div>
				</div>
				<div class="mb-3 row">
					<label for="roleType" class="col-sm-2 col-form-label">roleType</label>
					<div class="col-sm-4">
						<input type="text" class="form-control" id="roleType" name='roleType' th:value='${obj.roleType}'>
					</div>
				</div>

				<div class="form-group">
					<div class="col-sm-offset-10 col-sm-2">
						<input type="submit" class="btn btn-success" value="保存"/>
					</div>
				</div>
			</form>
		</div>
	</div>
</div>


</body>
<section layout:fragment="scripts">
	<script th:src="@{/assets/bootstrap5/js/bootstrap.bundle.min.js}"></script>
	<script th:src="@{/assets/bootstrap5/js/jquery-3.5.1.min.js}"></script>
	<script type="text/javascript" src="/assets/js/util.js"></script>
	<script type="text/javascript" src="/assets/js/sysRole.js"></script>
	<script th:inline="javascript">
		refreshBreadcrumb([
			{name: 'Home', url: '/home'},
			{name: '角色', url: '/sysRole'},
			{name: '新增页'}
		]);
		toggleCollapseById('sys-collapse');
	</script>
</section>
</html>
