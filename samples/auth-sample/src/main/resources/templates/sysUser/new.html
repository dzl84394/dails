<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/base}">
<head>
	<title>系统首页</title>
</head>
<body>


<!-- 主内容区域 -->
<div layout:fragment="content">
	<div class="col-sm-9 col-sm-offset-3 col-md-10 col-md-offset-2">
		<h3 class="blog-title">sysUser 添加</h3>
		<div th:fragment="sysUserForm">
			<form id="sysUserForm"  class="form-horizontal"  th:action="@{/sysUser/save}" th:method="post"
				  th:object="${obj}">
				<input type="hidden" class="form-control" name="id" id="id" th:value="${id}" />
				
				<div class="mb-3 row">
					<label for="deptId" class="col-sm-2 col-form-label">deptId</label>
					<div class="col-sm-4">
						<input type="text" class="form-control" id="deptId" name='deptId' th:value='${obj.deptId}'>
					</div>
				</div>
				<div class="mb-3 row">
					<label for="username" class="col-sm-2 col-form-label">username</label>
					<div class="col-sm-4">
						<input type="text" class="form-control" id="username" name='username' th:value='${obj.username}'>
					</div>
				</div>
				<div class="mb-3 row">
					<label for="password" class="col-sm-2 col-form-label">password</label>
					<div class="col-sm-4">
						<input type="text" class="form-control" id="password" name='password' th:value='${obj.password}'>
					</div>
				</div>
				<div class="mb-3 row">
					<label for="mobile" class="col-sm-2 col-form-label">mobile</label>
					<div class="col-sm-4">
						<input type="text" class="form-control" id="mobile" name='mobile' th:value='${obj.mobile}'>
					</div>
				</div>
				<div class="mb-3 row">
					<label for="email" class="col-sm-2 col-form-label">email</label>
					<div class="col-sm-4">
						<input type="text" class="form-control" id="email" name='email' th:value='${obj.email}'>
					</div>
				</div>
				<div class="mb-3 row">
					<label for="reportId" class="col-sm-2 col-form-label">reportId</label>
					<div class="col-sm-4">
						<input type="text" class="form-control" id="reportId" name='reportId' th:value='${obj.reportId}'>
					</div>
				</div>
				<div class="mb-3 row">
					<label for="contactId" class="col-sm-2 col-form-label">contactId</label>
					<div class="col-sm-4">
						<input type="text" class="form-control" id="contactId" name='contactId' th:value='${obj.contactId}'>
					</div>
				</div>
				<div class="mb-3 row">
					<label for="deleted" class="col-sm-2 col-form-label">deleted</label>
					<div class="col-sm-4">
						<input type="text" class="form-control" id="deleted" name='deleted' th:value='${obj.deleted}'>
					</div>
				</div>
				<div class="mb-3 row">
					<label for="enabled" class="col-sm-2 col-form-label">enabled</label>
					<div class="col-sm-4">
						<input type="text" class="form-control" id="enabled" name='enabled' th:value='${obj.enabled}'>
					</div>
				</div>
				<div class="mb-3 row">
					<label for="accountNonExpired" class="col-sm-2 col-form-label">accountNonExpired</label>
					<div class="col-sm-4">
						<input type="text" class="form-control" id="accountNonExpired" name='accountNonExpired' th:value='${obj.accountNonExpired}'>
					</div>
				</div>
				<div class="mb-3 row">
					<label for="accountNonLocked" class="col-sm-2 col-form-label">accountNonLocked</label>
					<div class="col-sm-4">
						<input type="text" class="form-control" id="accountNonLocked" name='accountNonLocked' th:value='${obj.accountNonLocked}'>
					</div>
				</div>
				<div class="mb-3 row">
					<label for="credentialsNonExpired" class="col-sm-2 col-form-label">credentialsNonExpired</label>
					<div class="col-sm-4">
						<input type="text" class="form-control" id="credentialsNonExpired" name='credentialsNonExpired' th:value='${obj.credentialsNonExpired}'>
					</div>
				</div>

				<div class="form-group">
					<div class="col-sm-offset-10 col-sm-2">
						<input type="submit" class="btn btn-success" value="保存"/>
					</div>
				</div>
			</form>
		</div>
	</div>
</div>


</body>
<section layout:fragment="scripts">
	<script th:src="@{/assets/bootstrap5/js/bootstrap.bundle.min.js}"></script>
	<script th:src="@{/assets/bootstrap5/js/jquery-3.5.1.min.js}"></script>
	<script type="text/javascript" src="/assets/js/util.js"></script>
	<script type="text/javascript" src="/assets/js/sysUser.js"></script>
	<script th:inline="javascript">
		refreshBreadcrumb([
			{name: 'Home', url: '/home'},
			{name: '修改', url: '/sysUser'},
			{name: '新增页'}
		]);
		toggleCollapseById('sys-collapse');
	</script>
</section>
</html>
