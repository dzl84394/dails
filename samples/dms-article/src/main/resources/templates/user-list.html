<!-- src/main/resources/templates/user-list.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">用户列表</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Vue 3 开发版 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <!-- Element Plus 样式 -->
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">

    <!-- Element Plus 组件库 -->
    <script src="https://unpkg.com/element-plus"></script>

    <style>
        [v-cloak] { display: none; }
        .user-table {
            margin: 20px auto;
            width: 90%;
        }
        .back-btn {
            margin: 20px 0 0 20px;
        }
    </style>
</head>
<body>
<div id="app" v-cloak>
    <!-- 返回按钮 -->
    <el-button
            class="back-btn"
            type="info"
            @click="goBack"
            icon="Back">
        返回首页
    </el-button>

    <!-- 用户表格 -->
    <el-card class="user-table">
        <template #header>
            <div class="card-header">
                <span>用户列表（共 [[ users.length ]] 人）</span>
            </div>
        </template>

        <el-table :data="users" border>
            <el-table-column prop="id" label="ID" width="80"></el-table-column>
            <el-table-column prop="name" label="姓名"></el-table-column>
            <el-table-column prop="email" label="邮箱"></el-table-column>
            <el-table-column label="操作" width="120">
                <template #default="scope">
                    <el-button
                            size="small"
                            @click="showDetail(scope.row)">
                        详情
                    </el-button>
                </template>
            </el-table-column>
        </el-table>
    </el-card>

    <!-- 详情对话框 -->
    <el-dialog v-model="dialogVisible" title="用户详情">
        <div v-if="currentUser">
            <p><strong>ID：</strong>[[ currentUser.id ]]</p>
            <p><strong>姓名：</strong>[[ currentUser.name ]]</p>
            <p><strong>邮箱：</strong>[[ currentUser.email ]]</p>
        </div>
    </el-dialog>
</div>

<!-- 服务端数据注入 -->
<script th:inline="javascript">
    /*<![CDATA[*/
        const serverUsers = /*[[${users}]]*/ [];
    /*]]>*/
</script>

<script>
    const { createApp } = Vue;

    createApp({
<!--        delimiters: ['[[', ']]'],-->
        data() {
            return {
                users: serverUsers.map(u => ({
                    id: u.id,
                    name: u.name,
                    email: u.email
                })),
                dialogVisible: false,
                currentUser: null
            }
        },
        methods: {
            goBack() {
                window.history.back();
            },
            showDetail(user) {
                this.currentUser = user;
                this.dialogVisible = true;
            }
        }
    })
    .use(ElementPlus)
    .mount('#app');
</script>
</body>
</html>
